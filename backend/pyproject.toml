[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spill-backend"
version = "0.1.0"
description = "Zero-Knowledge Anonymous Employee Feedback Platform - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "python-ulid==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.1",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "bandit==1.7.10",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["S104", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/spill/adapters/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=spill --cov-report=term-missing"

[tool.coverage.run]
source = ["spill"]
omit = ["*/tests/*"]
